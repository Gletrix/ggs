name: Build and Sign Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew script not found. Generating wrapper via system Gradle..."
            gradle wrapper --gradle-version 8.11.1
          fi

      - name: Grant executable permissions
        run: chmod +x gradlew

      - name: Ensure release keystore exists
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mypassword \
              -keypass mypassword \
              -dname "CN=Dev, OU=Dev, O=Dev, L=City, S=State, C=US" \
              -noprompt
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: mypassword
          KEY_ALIAS: upload
          KEY_PASSWORD: mypassword
        run: ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

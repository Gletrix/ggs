name: Build and Sign Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle Wrapper exists
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradlew ]; then
            echo "gradlew not found. Downloading wrapper script..."
            curl -Lo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradlew
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found. Downloading jar..."
            curl -Lo gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Grant executable permissions
        run: chmod +x gradlew

      - name: Ensure release keystore exists
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mypassword \
              -keypass mypassword \
              -dname "CN=Dev, OU=Dev, O=Dev, L=City, S=State, C=US" \
              -noprompt
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: mypassword
          KEY_ALIAS: upload
          KEY_PASSWORD: mypassword
        run: ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
